name: Android Play readiness
on:
  workflow_dispatch:
  push:
    branches: [ main ]
concurrency:
  group: android-play-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure and validate optional Play upload signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          values=("$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD")
          configured=0
          missing=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); else missing=$((missing + 1)); fi
          done
          if [ "$configured" -ne 0 ] && [ "$missing" -ne 0 ]; then
            echo "::error::Signing secrets are incomplete. Configure all four PLAY_UPLOAD_* secrets or none."
            exit 1
          fi
          if [ "$configured" -eq 4 ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/play-upload.jks"
            keytool -list -keystore "$RUNNER_TEMP/play-upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "PLAY_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/play-upload.jks" >> "$GITHUB_ENV"
            echo "PLAY_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PLAY_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PLAY_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "PLAY_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Release signing configuration validated."
          else
            echo "PLAY_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::warning::No upload signing secrets configured. A Play-ready signed AAB will not be published as an artifact."
          fi
      - name: Build and test
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
        run: |
          set -euo pipefail
          if { [ -n "$ADMOB_APP_ID" ] && [ -z "$ADMOB_BANNER_AD_UNIT_ID" ]; } || { [ -z "$ADMOB_APP_ID" ] && [ -n "$ADMOB_BANNER_AD_UNIT_ID" ]; }; then
            echo "::error::Configure both ADMOB_APP_ID and ADMOB_BANNER_AD_UNIT_ID, or leave both empty."
            exit 1
          fi
          if [ -n "$ADMOB_APP_ID" ]; then
            if [[ ! "$ADMOB_APP_ID" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]]; then
              echo "::error::ADMOB_APP_ID has an invalid format."
              exit 1
            fi
            if [[ ! "$ADMOB_BANNER_AD_UNIT_ID" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]]; then
              echo "::error::ADMOB_BANNER_AD_UNIT_ID has an invalid format."
              exit 1
            fi
            if [ "$ADMOB_APP_ID" = "ca-app-pub-3940256099942544~3347511713" ] || [ "$ADMOB_BANNER_AD_UNIT_ID" = "ca-app-pub-3940256099942544/9214589741" ]; then
              echo "::error::Google test ad IDs must never be used in a release build."
              exit 1
            fi
          fi
          gradle testDebugUnitTest
          gradle assembleDebug
          gradle bundleRelease
      - name: Verify signed Play App Bundle
        if: env.PLAY_SIGNING_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
          echo "AAB signature verification completed."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hasib-fawraty-dz-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload signed Play App Bundle
        if: env.PLAY_SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hasib-fawraty-dz-signed-play-aab
          path: app/build/outputs/bundle/release/app-release.aab

# Signing validation rerun after upload-key secrets were provisioned.
