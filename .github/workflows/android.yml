name: Android Play readiness
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure optional Play upload signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/play-upload.jks"
            echo "PLAY_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/play-upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Build and test
        env:
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          gradle testDebugUnitTest
          gradle assembleDebug
          gradle bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hasib-fawraty-dz-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: hasib-fawraty-dz-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
