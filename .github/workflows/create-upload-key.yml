name: Create independent Play upload key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-upload-key:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate upload key and save only as encrypted GitHub Actions secrets
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a temporary fine-grained PAT as the REPO_ADMIN_TOKEN repository secret first."
            exit 1
          fi

          KEY_DIR="$RUNNER_TEMP/hasib-upload-key"
          mkdir -p "$KEY_DIR"
          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$STORE_PASSWORD"
          KEY_ALIAS="hasibfawraty"
          KEYSTORE="$KEY_DIR/hasib-fawraty-upload.jks"

          keytool -genkeypair -noprompt -v \
            -keystore "$KEYSTORE" -storetype JKS \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Hasib Fawraty DZ, OU=Mobile, O=Hasib Fawraty DZ, L=Algeria, ST=Algeria, C=DZ"

          base64 -w 0 "$KEYSTORE" > "$KEY_DIR/keystore.b64"
          export STORE_PASSWORD KEY_PASSWORD KEY_ALIAS KEYSTORE_B64_FILE="$KEY_DIR/keystore.b64"

          sudo apt-get update -y
          sudo apt-get install -y python3-nacl
          python3 <<'PY'
          import base64, json, os, urllib.request
          from nacl.public import PublicKey, SealedBox

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}/actions/secrets"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def call(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else {}

          public = call(api + "/public-key")
          box = SealedBox(PublicKey(base64.b64decode(public["key"])))
          with open(os.environ["KEYSTORE_B64_FILE"], encoding="ascii") as stream:
              keystore_b64 = stream.read().strip()

          secrets = {
              "PLAY_UPLOAD_KEYSTORE_BASE64": keystore_b64,
              "PLAY_UPLOAD_KEYSTORE_PASSWORD": os.environ["STORE_PASSWORD"],
              "PLAY_UPLOAD_KEY_ALIAS": os.environ["KEY_ALIAS"],
              "PLAY_UPLOAD_KEY_PASSWORD": os.environ["KEY_PASSWORD"],
          }
          for name, value in secrets.items():
              encrypted = base64.b64encode(box.encrypt(value.encode())).decode()
              call(api + "/" + name, "PUT", {
                  "encrypted_value": encrypted,
                  "key_id": public["key_id"],
              })
              print("Saved encrypted repository secret:", name)

          # Remove the temporary administrative token from repository secrets.
          call(api + "/REPO_ADMIN_TOKEN", "DELETE")
          print("SUCCESS: all four signing secrets were saved; temporary admin token removed.")
          PY

      - name: Remove temporary signing files from runner
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/hasib-upload-key"
          echo "Temporary key files removed from the runner."
